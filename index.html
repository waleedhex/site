.rtb .lk{width:120px;padding:6px;border:1px solid var(--border);border-radius:8px;background:var(--secondary);color:var(--fg);font:inherit;font-size:16px}

async function savePublishedPageRoute(button){

 const field=$("public-page-slug");

  toast("اكتب اسم رابط صالحًا بحروف إنجليزية وأرقام أو شرطات");return;
 }
 const key=page.kind+":"+page.slug;
 const before=JSON.parse(ORIG);
 const routes={...(before.s.pageRoutes||{})};
 const old=siteRoutes.pageSlug(before.s,page);

 const belongsToOther=editor.pages.some(item=>item.kind===page.kind&&item.slug!==page.slug&&item.slug===next)||
  Object.entries(routes).some(([id,route])=>id!==key&&id.startsWith(page.kind+":")&&
   (route.slug===next||route.aliases?.includes(next)));
 if(belongsToOther){toast("اسم الرابط مستخدم في صفحة أخرى");return}
 routes[key]={slug:next,aliases};
 before.s.pageRoutes=routes;
 savingSite=true;button.disabled=true;

  if(editor!==pageEditor)return;

 finally{savingSite=false;if(button.isConnected)button.disabled=false}

$("adm").addEventListener("submit",async event=>{
 const form=event.target;
 if(form.id!=="pages-editor")return;
 event.preventDefault();
 const editor=pageEditor;
 if(editor.busy||!ADMIN)return;
 const operation=event.submitter?.value||"save";
 const {kind,title,slug,seoTitle,description,image,indexable,footer}=form.elements;
 const body=form.querySelector("#page-body");
 if(operation!=="unpublish"&&image.value&&!/^https:\/\//i.test(image.value)){
  toast("اكتب رابط صورة يبدأ بـ https://");return;
 }
 const content=operation==="unpublish"?"":sitePageContent.encode(body);
 if(content.length>60000){toast("المحتوى طويل جدًا. اختصره ثم حاول مجددًا");return}
 const data={kind:kind.value,title:title.value,body:content,seoTitle:seoTitle.value,
  description:description.value,image:image.value,indexable:indexable.checked,footer:footer.checked};
 const action=editor.slug?operation:"create";
 const id=slug.value.trim().toLowerCase();
 if(action==="create"&&(kind.value==="page"&&siteRoutes.reserved.has(id)||

 }
 editor.busy=true;
 body.contentEditable="false";
 form.querySelectorAll("button,select,input,textarea").forEach(control=>control.disabled=true);
 let reload=false;
 try{
  if(!await pagesOperation(editor,action,id,data))return;
  const previous=editor.pages.find(page=>page.slug===id);
  const updated=action==="unpublish"?{...previous,published:false}:
   {...data,slug:id,published:action==="publish"||Boolean(previous?.published)};
  editor.pages=[...editor.pages.filter(page=>page.slug!==id),updated].sort((a,b)=>a.title.localeCompare(b.title,"ar"));
  editor.slug=id;

  if(action==="publish"||action==="unpublish")refreshPublicPages();

 }catch(e){if(editor===pageEditor)toast(e.message)}
 finally{

  else if(form.isConnected){
   body.contentEditable="true";
   form.querySelectorAll("button,select,input,textarea").forEach(control=>control.disabled=false);
  }
 }
});

function prepareAppRoutes(data,previous){
 const claims=new Map();

  const raw=typeof app.urlSlug==="string"?app.urlSlug.trim().toLowerCase():"";
  if(raw&&!siteRoutes.validSlug(raw))throw new Error("اسم رابط التطبيق غير صالح في «"+app.name+"»");
  app.urlSlug=raw;
  const before=previous.a.find(item=>item.slug===app.slug);
  if(before)app.urlAliases=siteRoutes.nextAliases(siteRoutes.appSlug(before),siteRoutes.appSlug(app),siteRoutes.appAliases(before));
  for(const slug of [siteRoutes.appSlug(app),...siteRoutes.appAliases(app)]){
   if(!siteRoutes.validSlug(slug))continue;
   if(claims.has(slug)&&claims.get(slug)!==app.slug)throw new Error("رابط التطبيق مستخدم بالفعل: "+slug);
   claims.set(slug,app.slug);
  }
