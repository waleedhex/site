function formatPageBody(textarea,format,value){
 const start=textarea.selectionStart,end=textarea.selectionEnd,body=textarea.value;
 const selected=body.slice(start,end);
 let replacement;
 if(format==="h2"||format==="h3"){
  const from=start===0?0:body.lastIndexOf("\n",start-1)+1;
  const newline=body.indexOf("\n",end>start&&body[end-1]==="\n"?end-1:end);
  const to=newline<0?body.length:newline;
  const line=body.slice(from,to).replace(/^#{2,3} +/,"");
  replacement=(format==="h2"?"## ":"### ")+(line||"عنوان");
  if(body.length-(to-from)+replacement.length>textarea.maxLength)return;
  textarea.setRangeText(replacement,from,to,"end");
 }else{
  const text=selected||"النص";
  if(format==="bold")replacement="**"+text+"**";
  if(format==="color")replacement="[color="+value+"]"+text+"[/color]";
  if(format==="link"){
   const label=prompt("النص الظاهر للرابط",selected||"");
   if(!label?.trim())return;
   const url=prompt("الرابط (https:// أو مسار داخل الموقع مثل /about)","");
   if(!url?.trim())return;
   const target=url.trim();
   if(!/^(https?:\/\/[^\s]+|\/(?![\/\\])[^\s]*)$/i.test(target)){
    toast("اكتب رابط موقع أو مسارًا صحيحًا داخل الموقع");return;
   }
   replacement="["+label.trim().replace(/[\[\]\r\n]/g," ")+"]("+target.replace(/\(/g,"%28").replace(/\)/g,"%29")+")";
  }
  if(!replacement||body.length-(end-start)+replacement.length>textarea.maxLength)return;
  textarea.setRangeText(replacement,start,end,"end");
 }
 textarea.focus();
}
